
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool-Using AI Agent</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #262b36;
    --text: #e7e9ee;
    --muted: #8b93a7;
    --accent: #7c9cff;
    --tool: #5fd3a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px;
    background: var(--bg); color: var(--text);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .row { display: flex; gap: 10px; }
  input {
    flex: 1; padding: 13px 15px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 13px 22px; border: 0; border-radius: 10px;
    background: var(--accent); color: #0f1115;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .examples { margin: 14px 0 26px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: transparent; color: var(--muted); font-size: 13px;
    cursor: pointer; font-weight: 400;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
  }
  .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin-bottom: 10px;
  }
  .answer { white-space: pre-wrap; }
  .call {
    border-left: 2px solid var(--tool); padding: 2px 0 2px 12px;
    margin-bottom: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
  }
  .call:last-child { margin-bottom: 0; }
  .call .name { color: var(--tool); }
  .call .args { color: var(--muted); word-break: break-all; }
  .call .res { margin-top: 4px; color: var(--text); word-break: break-word; }
  .hidden { display: none; }
  footer { margin-top: 34px; color: var(--muted); font-size: 12.5px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">

  <h1>Tool-Using AI Agent</h1>
  <p class="sub">
    The model decides on its own whether to run symbolic math, search the web,
    or answer directly. The trace shows exactly what it chose.
  </p>

  <div class="row">
    <input id="q" placeholder="e.g. integrate x**2 * sin(x) with respect to x" autocomplete="off">
    <button id="go">Ask</button>
  </div>

  <div class="examples" id="chips"></div>

  <div class="card hidden" id="answerCard">
    <div class="label">Answer</div>
    <div class="answer" id="answer"></div>
  </div>

  <div class="card hidden" id="traceCard">
    <div class="label">Tool trace</div>
    <div id="trace"></div>
  </div>

  <footer>
    Gemini function calling · SymPy · FastAPI —
    running on a free tier, so occasional rate limits are expected.
  </footer>

</div>

<script>
// ── Point this at your deployed backend ───────────────────────────────
const API = "https://math-tool-using-ai-agent.onrender.com"
// ──────────────────────────────────────────────────────────────────────

const EXAMPLES = [
  "What is 45678 * 12345?",
  "Differentiate x**3 + 2*x with respect to x",
  "Integrate x**2 * sin(x) with respect to x",
  "Solve x**2 - 5*x + 6 = 0",
  "Factor x**2 - 9",
  "What's the latest news about ISRO?",
  "What is India's population multiplied by 3?"
];

const q = document.getElementById("q");
const go = document.getElementById("go");
const answerCard = document.getElementById("answerCard");
const traceCard = document.getElementById("traceCard");
const answerEl = document.getElementById("answer");
const traceEl = document.getElementById("trace");

EXAMPLES.forEach(text => {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = text;
  b.onclick = () => { q.value = text; ask(); };
  document.getElementById("chips").appendChild(b);
});

async function ask() {
  const question = q.value.trim();
  if (!question) return;

  go.disabled = true;
  go.textContent = "Thinking…";
  answerCard.classList.remove("hidden");
  traceCard.classList.add("hidden");
  answerEl.textContent = "Working… (first request may take ~30s if the server was asleep)";

  try {
    const res = await fetch(API + "/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const data = await res.json();

    answerEl.textContent = data.answer;

    traceEl.innerHTML = "";
    if (data.trace && data.trace.length) {
      data.trace.forEach(c => {
        const d = document.createElement("div");
        d.className = "call";
        d.innerHTML =
          `<span class="name">${c.tool}</span>` +
          `<span class="args">(${JSON.stringify(c.args)})</span>` +
          `<div class="res">→ ${escapeHtml(c.result)}</div>`;
        traceEl.appendChild(d);
      });
      traceCard.classList.remove("hidden");
    }
  } catch (e) {
    answerEl.textContent = "Could not reach the backend: " + e.message;
  } finally {
    go.disabled = false;
    go.textContent = "Ask";
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

go.onclick = ask;
q.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
